# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Matches minimumReleaseAge in bunfig.toml, newer versions would be rejected by `bun install`.
    cooldown:
      default-days: 3
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
          - 'aws-sdk-client-mock'
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      # Nx and the tooling it manages should be updated by running `bun nx migrate latest`
      - dependency-name: '@nx/*'
      - dependency-name: 'nx'
      - dependency-name: '@swc/*'
      - dependency-name: '@swc-node/*'
      - dependency-name: 'typescript'
      - dependency-name: 'vitest'
      - dependency-name: '@vitest/*'
      # chalk 5+ is ESM only, the plugin is published as CommonJS
      - dependency-name: 'chalk'
        versions: ['>=5']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
